# Rebuilds the page from src/, refuses a stale committed build, and publishes
# the result to GitLab Pages.
#
# Runs on the project's own runner ("LXC 103 storieserver"). Instance and group
# runners are disabled for this project, so jobs will queue rather than fall back
# to GitLab's shared runners if that runner is offline.
#
# No `tags:` are set: the runner is untagged and accepts untagged jobs. The
# `image:` below is used when the runner has a Docker executor and harmlessly
# ignored on a shell executor -- the scripts only need sh, cat, cp, diff, mkdir.
stages: [verify, deploy]

# The built files are committed so the repo works on clone. This makes sure they
# actually match what src/ produces.
build-is-current:
  stage: verify
  image: alpine:3.20
  script:
    - cp index.html .index.committed
    - cp app.html .app.committed
    - cp sw.js .sw.committed
    - cp server/src/rules.js .rules.committed
    - sh build.sh
    - |
      if ! diff -q .index.committed index.html || ! diff -q .app.committed app.html          || ! diff -q .sw.committed sw.js || ! diff -q .rules.committed server/src/rules.js; then
        echo "The committed build is stale. Run ./build.sh and commit the result."
        exit 1
      fi
    - echo "Committed build matches src/."

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - sh build.sh
    - mkdir -p public
    - cp index.html manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The rules core is the one thing both the browser and the relay depend on.
rules-tests:
  stage: verify
  image: node:22-alpine
  script:
    - npm ci --no-audit --no-fund || npm install --no-audit --no-fund
    - sh build.sh
    - node test-rules.mjs
    - node test-view.mjs
    - node test-live.mjs
    - node test-stats.mjs
    - node test-app.mjs
    - node test-qr.mjs
    - node test-build.mjs
    # the committed icons must match what the generator produces
    - cp icon-180.png .i180 && cp icon-192.png .i192 && cp icon-512.png .i512
    - cp src/fonts.css .fonts.committed
    - node tools/make-icons.mjs
    - node tools/make-fonts.mjs
    - |
      if ! diff -q .fonts.committed src/fonts.css; then
        echo "src/fonts.css is stale. Run node tools/make-fonts.mjs and commit it."
        exit 1
      fi
    - rm -f .fonts.committed
    - |
      if ! diff -q .i180 icon-180.png || ! diff -q .i192 icon-192.png || ! diff -q .i512 icon-512.png; then
        echo "Icons are stale. Run node tools/make-icons.mjs and commit the result."
        exit 1
      fi
    - rm -f .i180 .i192 .i512

# The relay's lifecycle -- promoting the host off a phone that never comes back,
# expiring an idle room -- exists only in time, and none of it was ever covered
# here: the tests need a running worker, so they only ever ran by hand. That gap
# is how a dead host came to strand a whole table through two code reviews.
#
# The worker reads its timings from the environment for exactly this reason, so
# the 90-second grace period becomes 1.5 seconds and the suite can assert that a
# new host actually takes over rather than asserting some cheaper proxy.
relay-tests:
  stage: verify
  image: node:22               # not alpine: workerd wants glibc
  variables:
    WRANGLER_SEND_METRICS: "false"
  script:
    - sh build.sh              # the relay imports the generated rules module
    - cd server
    - npm ci --no-audit --no-fund || npm install --no-audit --no-fund
    - npx wrangler dev --port 8787 --local --var HOST_GRACE_MS:1500 &
    - |
      for i in $(seq 1 90); do
        curl -sf http://127.0.0.1:8787/api/health >/dev/null && break
        sleep 1
      done
    - curl -sf http://127.0.0.1:8787/api/health
    - node test-relay.mjs
