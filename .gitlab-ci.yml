# Rebuilds the page from src/, refuses a stale committed build, and publishes
# the result to GitLab Pages.
#
# Runs on the project's own runner ("LXC 103 storieserver"). Instance and group
# runners are disabled for this project, so jobs will queue rather than fall back
# to GitLab's shared runners if that runner is offline.
#
# No `tags:` are set: the runner is untagged and accepts untagged jobs. The
# `image:` below is used when the runner has a Docker executor and harmlessly
# ignored on a shell executor -- the scripts only need sh, cat, cp, diff, mkdir.
stages: [verify, deploy]

# The built files are committed so the repo works on clone. This makes sure they
# actually match what src/ produces.
build-is-current:
  stage: verify
  image: alpine:3.20
  script:
    - cp index.html .index.committed
    - cp app.html .app.committed
    - sh build.sh
    - |
      if ! diff -q .index.committed index.html || ! diff -q .app.committed app.html; then
        echo "The committed build is stale. Run ./build.sh and commit the result."
        exit 1
      fi
    - echo "Committed build matches src/."

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - sh build.sh
    - mkdir -p public
    - cp index.html public/index.html
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
